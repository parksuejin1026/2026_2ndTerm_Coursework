<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>키보드와 마우스 이벤트</title>
  
  <script src="./9-31p.js" defer></script>
</head>
<body>
  <h2>키보드 이벤트</h2>
  <input id="keyInput" type="text" placeholder="키보드를 입력하세요" />
  <p id="keyResult">입력 대기 중...</p>
  <hr />
  <h2>마우스 이벤트</h2>
  <div id="mouseArea" style="width:400px;height:180px;border:2px solid blue;background-color:#eef5ff;padding:10px;">
    이 영역에서 마우스를 움직이거나 클릭하세요.
  </div>
  <p id="mouseResult">마우스 이벤트 대기 중...</p>
</body>
</html>
