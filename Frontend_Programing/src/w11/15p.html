
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Math 숫자 맞히기 게임</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .game {
      width: 360px;
      padding: 20px;
      border: 2px solid royalblue;
      background-color: #eef4ff;
    }

    input {
      padding: 8px;
      width: 100px;
    }

    button {
      padding: 8px 12px;
      cursor: pointer;
    }

    #result {
      font-weight: bold;
      color: royalblue;
    }
  </style>

  <script src="./15p_math.js" defer></script>
</head>
<body>
  <h2>Math 객체 숫자 맞히기 게임</h2>

  <div class="game">
    <p>1부터 10까지의 숫자를 맞혀보세요!</p>

    <label for="guessInput">숫자 입력:</label>

    <input
      type="number"
      id="guessInput"
      min="1"
      max="10"
      step="1"
    />

    <button id="checkBtn">정답 확인</button>
    <button id="restartBtn">다시 시작</button>

    <p id="result">숫자를 입력하세요.</p>
    <p id="countResult">시도 횟수: 0</p>
  </div>
</body>
</html>
